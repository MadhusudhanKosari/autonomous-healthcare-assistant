services:
  - type: web
    name: healthcare-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: llama3-8b-8192